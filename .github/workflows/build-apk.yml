name: Build HyperOS 3 APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true
      - name: Fix Flutter structure
        run: |
          mv lib/main.dart /tmp/main.dart.bak
          mv pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create . --project-name hyperos3_theme_studio --org com.fouad.hyperos --platforms android --no-pub
          mv /tmp/pubspec.yaml.bak pubspec.yaml
          mv /tmp/main.dart.bak lib/main.dart
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: HyperOS3-APK
          path: build/app/outputs/flutter-apk/app-release.apk
